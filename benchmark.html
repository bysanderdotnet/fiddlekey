<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiddlekey Benchmark</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <style>
      #benchmark { max-width: 960px; margin: 0 auto; padding: 16px; text-align: left; }
      #benchmark fieldset { margin-bottom: 12px; border: 1px solid #444; border-radius: 6px; }
      #benchmark label.check { display: inline-flex; align-items: center; gap: 4px; margin: 2px 10px 2px 0; }
      #benchmark .num-row { display: inline-flex; align-items: center; gap: 6px; margin-right: 16px; }
      #benchmark input[type="number"] { width: 5em; }
      #benchmark table { border-collapse: collapse; margin-top: 12px; width: 100%; }
      #benchmark th, #benchmark td { border: 1px solid #555; padding: 4px 8px; font-size: 0.85rem; text-align: left; }
      #benchmark tr.row-correct td { background: rgba(0, 128, 0, 0.18); }
      #benchmark tr.row-wrong td { background: rgba(180, 0, 0, 0.18); }
      #benchmark td.danger { color: #ff6b6b; font-weight: 700; }
      #benchmark td.debug { opacity: 0.6; }
      #benchmark-status { min-height: 1.4em; margin: 8px 0; }
      #benchmark-json { max-height: 240px; overflow: auto; font-size: 0.7rem; background: rgba(0,0,0,0.25); padding: 8px; }
    </style>
  </head>
  <body>
    <div id="benchmark">
      <h1>Fiddlekey Benchmark 🎻⏱️</h1>
      <p>
        Runs synthesized versions of the ABC test tunes through the real
        detection pipeline and reports accuracy and time-to-detect per
        detector. Pick a subset of tunes and detectors to keep runs short.
      </p>

      <fieldset>
        <legend>Detectors</legend>
        <div id="detector-checkboxes"></div>
      </fieldset>

      <fieldset>
        <legend>Tunes</legend>
        <div id="tune-checkboxes"></div>
      </fieldset>

      <fieldset>
        <legend>Run options</legend>
        <span class="num-row">
          <label for="durationSec">Audio length (s)</label>
          <input type="number" id="durationSec" value="30" min="5" max="120">
        </span>
        <span class="num-row">
          <label for="noiseType">Noise</label>
          <select id="noiseType">
            <option value="none">None</option>
            <option value="session">Session (babble + taps + clinks)</option>
            <option value="babble">Crowd babble</option>
            <option value="white">White</option>
          </select>
        </span>
        <span class="num-row">
          <label for="snrDb">SNR (dB)</label>
          <input type="number" id="snrDb" value="10" step="1">
        </span>
        <span class="num-row">
          <label for="noiseSeed">Seed</label>
          <input type="number" id="noiseSeed" value="1" step="1">
        </span>
      </fieldset>

      <button id="runBenchmark">Run benchmark</button>
      <div id="benchmark-status" aria-live="polite"></div>

      <div id="benchmark-summary"></div>
      <div id="benchmark-results"></div>
      <h3>Raw results (JSON)</h3>
      <pre id="benchmark-json"></pre>
    </div>

    <script type="module" src="/src/benchmark/main.js"></script>
  </body>
</html>
